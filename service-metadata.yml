schema_version: 1
framework_policy_version: "2026.09.3"
component:
  code: auth
  kind: api
  repository: MexIngSof/API.PY.DJANGO.Auth
  compose_owner: MexIngSof/Docker.API.PY
  deployment_owner: self
runtime:
  ownership: SERVICE_ONLY
  stack: mexingsof_api
  network: mexingsof_pro
  internal_port: 8000
  health_path: /health/
  readiness_path: /ready/
  environment_file: /opt/mexingsof/config/services/api-auth.env
  secrets_file: /opt/mexingsof/secrets/api-auth.env
database:
  owner: self
  logical_name: Auth
  logical_name_variable: AUTH_DB_NAME
  user_policy: DB_USER_EQUALS_DB_NAME
  domain_schema: Auth
  runtime_schema: AuthRuntime
  search_path: '"Auth","AuthRuntime",public'
delivery:
  persistent_branches: [general, dev, pro, main]
  deploy_authority_branch: pro
  stable_branch: main
  image_policy: immutable_digest
  rollback_required: true
  hosted_ci_policy: direct_owner_vps_dispatch_only
contracts:
  compatibility_gate: required
  correlation_header: X-Request-ID
observability:
  log_format: json
validation:
  local_command: scripts/ci/local-validate.ps1
  modes: [fast, full, release]
