name: Repository framework policy

on:
  push:
    branches: [general, dev, pro]
    paths:
      - service-metadata.yml
      - .github/CODEOWNERS
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/dependabot.yml
      - .github/workflows/**
      - Dockerfile
      - requirements*.txt
  pull_request:
    branches: [general, dev, pro, main]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate repository framework contract
        run: |
          set -euo pipefail
          f=service-metadata.yml
          test -f "$f"
          test -f .github/CODEOWNERS
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/dependabot.yml
          grep -Fxq 'schema_version: 1' "$f"
          grep -Fxq 'framework_policy_version: "2026.09.1"' "$f"
          grep -Fxq '  deployment_owner: self' "$f"
          grep -Fxq '  ownership: SERVICE_ONLY' "$f"
          grep -Fxq '  network: mexingsof_pro' "$f"
          grep -Fxq '  deploy_authority_branch: pro' "$f"
          grep -Fxq '  stable_branch: main' "$f"
          grep -Fxq '  image_policy: immutable_digest' "$f"
          grep -Fxq '  rollback_required: true' "$f"
          grep -Fxq '  compatibility_gate: required' "$f"
          grep -Fxq '  correlation_header: X-Request-ID' "$f"
          grep -Fxq '  log_format: json' "$f"
          repo="$(sed -n 's/^  repository: //p' "$f")"
          test "$repo" = "$GITHUB_REPOSITORY"
          kind="$(sed -n 's/^  kind: //p' "$f")"
          case "$kind" in
            api)
              grep -Fxq '  stack: mexingsof_api' "$f"
              grep -Fxq '  internal_port: 8000' "$f"
              grep -Fxq '  health_path: /health/' "$f"
              grep -Fq '  environment_file: /opt/mexingsof/config/services/api-' "$f"
              grep -Fq '  secrets_file: /opt/mexingsof/secrets/api-' "$f"
              ;;
            web)
              grep -Fxq '  stack: mexingsof_web' "$f"
              grep -Fxq '  internal_port: 3000' "$f"
              grep -Fxq '  health_path: /health' "$f"
              grep -Fq '  environment_file: /opt/mexingsof/config/services/web-' "$f"
              grep -Fxq '  gateway_internal_base_url: http://api-gateway:8000/api/v1' "$f"
              ;;
            *) echo "unsupported component kind: $kind" >&2; exit 1 ;;
          esac
          d=.github/workflows/deploy-staging.yml
          p=.github/workflows/pro-image.yml
          test -f "$d"; test -f "$p"
          grep -Fq "github.ref == 'refs/heads/pro'" "$d"
          grep -Fq -- '--no-deps' "$d"
          grep -Fq 'RuntimeOwnership=SERVICE_ONLY' "$d"
          grep -Fq 'SiblingIsolation=PASS' "$d"
          grep -Fq 'before=' "$d"
          grep -Fq 'after=' "$d"
          grep -Fq 'rollback()' "$d"
          grep -Eq '(previous|prev)=' "$d"
          grep -Eq '(backup_dir|b)=' "$d"
          grep -Fq 'healthy' "$d"
          grep -Fq 'SBOMRequired=true' "$d"
          ! grep -Fq '/opt/mexingsof/config/common.env' "$d"
          ! grep -Fq '/opt/mexingsof/config/api-common.env' "$d"
          ! grep -Fq '/opt/mexingsof/config/web-common.env' "$d"
          ! grep -Eq '(^|:)latest([[:space:]]|$)' "$d"
          grep -Fq 'branches: [dev, pro]' "$p"
          grep -Fq "if: github.ref == 'refs/heads/pro'" "$p"
          grep -Fq 'sbom.cdx.json' "$p"
          grep -Fq 'SBOM=sbom.cdx.json' "$p"
          ! grep -Eq '(^|:)latest([[:space:]]|$)' "$p"
          python - <<'PY'
          from pathlib import Path
          import re, yaml
          pin=re.compile(r'^[^@\s]+@[0-9a-f]{40}$')
          def walk(x,path):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if k=='uses' and isinstance(v,str) and not v.startswith('./') and not pin.fullmatch(v):
                          raise SystemExit(f'unpinned action in {path}: {v}')
                      walk(v,path)
              elif isinstance(x,list):
                  for v in x: walk(v,path)
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              walk(yaml.safe_load(path.read_text()),path)
          PY
          echo 'FRAMEWORK_POLICY=PASS'
