name: API general CI

on:
  push:
    branches: [general]
  pull_request:
    branches: [general, dev, pro]

permissions:
  contents: read

jobs:
  validate-general:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: { python-version: "3.12" }
      - name: Validate workflows, Bash and immutable Actions
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, yaml
          pin=re.compile(r'^[^@\s]+@[0-9a-f]{40}$')
          def walk(x,path):
              if isinstance(x,dict):
                  for k,v in x.items():
                      if k=='uses' and isinstance(v,str) and not v.startswith('./') and not pin.fullmatch(v):
                          raise SystemExit(f'unpinned action in {path}: {v}')
                      walk(v,path)
              elif isinstance(x,list):
                  for v in x: walk(v,path)
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              data=yaml.safe_load(path.read_text())
              if not isinstance(data,dict): raise SystemExit(f'invalid workflow: {path}')
              walk(data,path)
              for job in (data.get('jobs') or {}).values():
                  for step in job.get('steps') or []:
                      script=step.get('run'); shell=str(step.get('shell') or 'bash')
                      if script and ('bash' in shell or step.get('shell') is None):
                          subprocess.run(['bash','-n'],input=script,text=True,check=True)
          PY
      - name: Validate Python syntax
        run: python -m compileall -q . -x '(^|/)(\.git|\.venv|venv|node_modules)/'
      - name: Enforce repository governance and independent delivery
        run: |
          set -euo pipefail
          test -f service-metadata.yml
          test -f .github/CODEOWNERS
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/dependabot.yml
          d=.github/workflows/deploy-staging.yml
          p=.github/workflows/pro-image.yml
          grep -Fq "github.ref == 'refs/heads/pro'" "$d"
          grep -Fq -- '--no-deps' "$d"
          grep -Fq 'sha256:' "$d"
          grep -Fq 'rollback()' "$d"
          grep -Eq '(previous|prev)=' "$d"
          grep -Eq '(backup_dir|b)=' "$d"
          grep -Fq 'RuntimeOwnership=SERVICE_ONLY' "$d"
          grep -Fq 'SiblingIsolation=PASS' "$d"
          grep -Fq 'before=' "$d"
          grep -Fq 'after=' "$d"
          grep -Fq 'healthy' "$d"
          grep -Fq 'SBOMRequired=true' "$d"
          grep -Fq 'branches: [dev, pro]' "$p"
          grep -Fq "if: github.ref == 'refs/heads/pro'" "$p"
          grep -Fq 'sbom.cdx.json' "$p"
          grep -Fq 'SBOM=sbom.cdx.json' "$p"
          ! grep -Fq 'runtime/common.env' "$d"
          ! grep -Fq 'runtime/api-common.env' "$d"
          ! grep -Fq '/opt/mexingsof/config/common.env' "$d"
          ! grep -Fq '/opt/mexingsof/config/api-common.env' "$d"
          ! grep -Eq '(^|:)latest([[:space:]]|$)' "$d"
          ! grep -Eq '(^|:)latest([[:space:]]|$)' "$p"
          echo 'GENERAL_REPOSITORY_GATE=PASS'
