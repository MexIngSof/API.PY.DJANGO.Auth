name: API general CI

on:
  push:
    branches: [general]
  pull_request:
    branches: [general, dev, pro]

permissions:
  contents: read

jobs:
  validate-general:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: "3.12" }
      - name: Validate workflows and embedded Bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              data = yaml.safe_load(path.read_text())
              if not isinstance(data, dict): raise SystemExit(f'invalid workflow: {path}')
              for job in (data.get('jobs') or {}).values():
                  for step in job.get('steps') or []:
                      script = step.get('run')
                      shell = str(step.get('shell') or 'bash')
                      if script and ('bash' in shell or step.get('shell') is None):
                          subprocess.run(['bash','-n'], input=script, text=True, check=True)
          PY
      - name: Validate Python syntax
        run: python -m compileall -q . -x '(^|/)(\.git|\.venv|venv|node_modules)/'
      - name: Enforce independent deployment ownership
        run: |
          set -euo pipefail
          f=.github/workflows/deploy-staging.yml
          grep -Fq "github.ref == 'refs/heads/pro'" "$f"
          grep -Fq -- '--no-deps' "$f"
          grep -Fq 'sha256:' "$f"
          grep -Fq 'trap' "$f"
          grep -Fq 'RuntimeOwnership=SERVICE_ONLY' "$f"
          ! grep -Fq 'runtime/common.env' "$f"
          ! grep -Fq 'runtime/api-common.env' "$f"
          ! grep -Fq '/opt/mexingsof/config/common.env' "$f"
          ! grep -Fq '/opt/mexingsof/config/api-common.env' "$f"
          ! grep -Eq '(^|:)latest([[:space:]]|$)' "$f"
