name: ERP Client Platform V1 Auth Self-Hosted Certification

on:
  workflow_dispatch:
  push:
    branches:
      - feature/erp-client-platform-v1

permissions:
  contents: read

concurrency:
  group: erp-client-platform-v1-auth-self-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  django-postgresql-self-hosted:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[self-hosted-cert]')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:14.4
        env:
          POSTGRES_DB: Auth
          POSTGRES_USER: Auth
          POSTGRES_PASSWORD: auth_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U Auth -d Auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SECRET_KEY: feature-ci-not-production
      DATABASE_URL: postgresql://Auth:auth_test_password@127.0.0.1:5432/Auth
      AUTH_TEST_POSTGRES_OPTIONS: -c search_path=public,"Auth","AuthRuntime"
      DEVELOPMENT_MODE: "True"
      AUTH_EMAIL_DEFERRED_EXTERNAL: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Dependency integrity
        run: python -m pip check
      - name: Owner-local PostgreSQL 14.4 certification
        run: python scripts/certify_erp_client_platform.py
