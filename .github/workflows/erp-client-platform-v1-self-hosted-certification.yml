name: ERP Client Platform V1 self-hosted certification

on:
  workflow_dispatch:

jobs:
  certify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/pro'
    runs-on: [self-hosted, linux, x64]
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: Auth
          POSTGRES_USER: Auth
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U Auth -d Auth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.15"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Certify ERP Client Platform V1
        run: python scripts/certify_erp_client_platform.py