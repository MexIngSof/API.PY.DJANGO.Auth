name: ERP Client Platform V1 Customer Permission Certification

on:
  push:
    branches:
      - feature/erp-client-platform-v1
    paths:
      - "access/**"
      - "roles/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/erp-client-platform-v1-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-client-platform-v1-auth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  customer-enterprise-permissions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:14.4
        env:
          POSTGRES_DB: auth_test
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: auth_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_test -d auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SECRET_KEY: feature-ci-not-production
      DATABASE_URL: postgresql://auth_test:auth_test_password@127.0.0.1:5432/auth_test
      AUTH_TEST_POSTGRES_OPTIONS: -c search_path=public,"Auth","AuthRuntime"
      DEVELOPMENT_MODE: "True"
      AUTH_EMAIL_DEFERRED_EXTERNAL: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Dependency integrity
        run: python -m pip check
      - name: Django system check
        run: python manage.py check
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run
      - name: Migration plan
        run: python manage.py migrate --plan
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Customer enterprise permission seed tests
        run: python manage.py test access.test_customer_enterprise_permissions --verbosity 2
