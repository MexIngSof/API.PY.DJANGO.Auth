name: Deploy Auth API to staging
on:
  workflow_dispatch:
    inputs:
      ci_run_id: { description: Successful PRO image run ID, required: true, type: string }
      confirm: { description: Type DEPLOY_AUTH_STAGING, required: true, type: string }
permissions: { actions: read, contents: read, packages: read }
concurrency: { group: api-auth-staging, cancel-in-progress: false }
jobs:
  deploy:
    if: github.ref == 'refs/heads/pro' && inputs.confirm == 'DEPLOY_AUTH_STAGING'
    runs-on: ubuntu-24.04
    environment: staging-pro-deploy
    env:
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      SERVICE: api-auth
      IMAGE_KEY: API_AUTH_IMAGE
      IMAGE_PATTERN: '^ghcr\.io/mexingsof/api-py-django-auth@sha256:[a-f0-9]{64}$'
      ARTIFACT_PREFIX: component-image-api-py-django-auth-
      DB_NAME: ${{ vars.AUTH_DB_NAME }}
      DB_USER: ${{ vars.AUTH_DB_USER }}
      DB_PASSWORD: ${{ secrets.AUTH_DB_PASSWORD }}
      DJANGO_SECRET_KEY: ${{ secrets.AUTH_DJANGO_SECRET_KEY }}
      DB_PORT: ${{ vars.DB_PORT }}
      AUTH_EMAIL_PROVIDER: ${{ vars.AUTH_EMAIL_PROVIDER }}
      AWS_SES_FROM_EMAIL: ${{ vars.AWS_SES_FROM_EMAIL }}
      AWS_SES_REGION: ${{ vars.AWS_SES_REGION }}
      AWS_SES_RETURN_PATH: ${{ vars.AWS_SES_RETURN_PATH }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AUTH_EMAIL_DEFERRED_EXTERNAL: 'true'
      STAGING_DEPLOY_HOST: ${{ vars.STAGING_DEPLOY_HOST }}
      STAGING_DEPLOY_PORT: ${{ vars.STAGING_DEPLOY_PORT }}
      STAGING_DEPLOY_USER: ${{ vars.STAGING_DEPLOY_USER }}
      STAGING_GHCR_USERNAME: ${{ vars.STAGING_GHCR_USERNAME }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.STAGING_DEPLOY_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
      STAGING_GHCR_READ_TOKEN: ${{ secrets.STAGING_GHCR_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve certified image
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          r="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID")"; test "$(jq -r .conclusion <<<"$r")" = success; test "$(jq -r .head_branch <<<"$r")" = pro; s="$(jq -r .head_sha <<<"$r")"; test "$s" = "$GITHUB_SHA"
          a="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/artifacts")"; ids="$(jq -r --arg p "$ARTIFACT_PREFIX" '.artifacts[]?|select(.expired==false and (.name|startswith($p)))|.id' <<<"$a")"; test "$(grep -c . <<<"$ids")" -eq 1; gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ids/zip" > a.zip; mkdir -p evidence/component; unzip -q a.zip -d evidence/component
          ref="$(sed -n 's/^IMAGE_REF=//p' evidence/component/component.env)"; [[ "$ref" =~ $IMAGE_PATTERN ]]; grep -Fxq "SOURCE_SHA=$s" evidence/component/component.env; grep -Fxq 'SOURCE_BRANCH=pro' evidence/component/component.env; printf 'IMAGE_REF=%s\nSOURCE_SHA=%s\n' "$ref" "$s" >> "$GITHUB_ENV"
      - name: Materialize Auth-owned runtime
        run: |
          set -euo pipefail; umask 077; mkdir -p runtime
          printf 'DB_HOST=db-postgresql\nPOSTGRES_HOST=db-postgresql\nDB_PORT=%s\nDB_NAME=%s\nDB_USER=%s\nAUTH_DB_NAME=%s\nAUTH_DB_USER=%s\nAUTH_EMAIL_PROVIDER=%s\nAWS_SES_FROM_EMAIL=%s\nAWS_SES_REGION=%s\nAWS_SES_RETURN_PATH=%s\nAUTH_EMAIL_DEFERRED_EXTERNAL=%s\n' "${DB_PORT:-5432}" "$DB_NAME" "$DB_USER" "$DB_NAME" "$DB_USER" "$AUTH_EMAIL_PROVIDER" "$AWS_SES_FROM_EMAIL" "$AWS_SES_REGION" "$AWS_SES_RETURN_PATH" "$AUTH_EMAIL_DEFERRED_EXTERNAL" > "runtime/$SERVICE.env"
          printf 'DB_PASSWORD=%s\nDJANGO_SECRET_KEY=%s\nAUTH_DB_PASSWORD=%s\nAUTH_DJANGO_SECRET_KEY=%s\nAWS_ACCESS_KEY_ID=%s\nAWS_SECRET_ACCESS_KEY=%s\n' "$DB_PASSWORD" "$DJANGO_SECRET_KEY" "$DB_PASSWORD" "$DJANGO_SECRET_KEY" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > "runtime/$SERVICE.secrets.env"; chmod 0600 runtime/*
      - name: Configure SSH
        run: |
          set -euo pipefail; install -d -m 0700 "$HOME/.ssh"; printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/key"; printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"; chmod 0600 "$HOME/.ssh/"{key,known_hosts}; printf 'Host staging-api\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/key\n  UserKnownHostsFile ~/.ssh/known_hosts\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n' "$STAGING_DEPLOY_HOST" "${STAGING_DEPLOY_PORT:-22}" "$STAGING_DEPLOY_USER" > "$HOME/.ssh/config"; chmod 0600 "$HOME/.ssh/config"; ssh -o BatchMode=yes staging-api 'test "$(id -u)" -ne 0'
      - name: Deploy Auth only
        run: |
          set -euo pipefail
          { printf '%s\n' "$STAGING_GHCR_USERNAME"; printf '%s\n' "$STAGING_GHCR_READ_TOKEN"; } | ssh staging-api 'read -r u; read -r t; d=/tmp/mexingsof-docker-api-auth; install -d -m 0700 "$d"; printf "%s" "$t"|docker --config "$d" login ghcr.io -u "$u" --password-stdin >/dev/null'
          scp "runtime/$SERVICE.env" staging-api:"/opt/mexingsof/config/services/$SERVICE.env.next"; scp "runtime/$SERVICE.secrets.env" staging-api:"/opt/mexingsof/secrets/$SERVICE.env.next"; printf '%s\n' "$IMAGE_REF" | ssh staging-api 'cat > /opt/mexingsof/config/services/api-auth.image-ref'
          ssh staging-api 'SERVICE=api-auth IMAGE_KEY=API_AUTH_IMAGE bash -se' <<'REMOTE'
          set -euo pipefail; c=/opt/mexingsof/stacks/api/compose.pro.yml; e="/opt/mexingsof/config/services/$SERVICE.env"; q="/opt/mexingsof/secrets/$SERVICE.env"; test -f "$c"; b="/opt/mexingsof/.deploy-backups/${SERVICE}-$(date +%s)-$$"; install -d -m 0700 "$b"; export DOCKER_CONFIG="/tmp/mexingsof-docker-$SERVICE"
          save(){ test -f "$1" && cp -p "$1" "$b/$2" || : > "$b/$2.absent"; }; restore(){ test -f "$b/$2.absent" && rm -f "$1" || cp -p "$b/$2" "$1"; }; prev="$(docker inspect -f '{{.Config.Image}}' "$SERVICE-pro" 2>/dev/null||true)"
          rollback(){ rc=$?; trap - ERR; set +e; restore "$e" env; restore "$q" secret; if test -n "$prev"; then for k in $(grep -oE '\$\{API_[A-Z0-9_]+_IMAGE' "$c"|cut -c3-|sort -u); do export "$k=$prev"; done; export "$IMAGE_KEY=$prev"; docker compose -p mexingsof_api -f "$c" up -d --no-deps --force-recreate "$SERVICE"; else docker compose -p mexingsof_api -f "$c" rm -sf "$SERVICE"||true; fi; rm -rf "$b" "$DOCKER_CONFIG"; exit "$rc"; }; trap rollback ERR
          save "$e" env; save "$q" secret; mv -f "$e.next" "$e"; mv -f "$q.next" "$q"; chmod 0600 "$e" "$q"; grep -Fq 'AUTH_EMAIL_DEFERRED_EXTERNAL=true' "$e"
          ref="$(cat "/opt/mexingsof/config/services/$SERVICE.image-ref")"; rm -f "/opt/mexingsof/config/services/$SERVICE.image-ref"; for k in $(grep -oE '\$\{API_[A-Z0-9_]+_IMAGE' "$c"|cut -c3-|sort -u); do export "$k=$ref"; done; export "$IMAGE_KEY=$ref"
          docker compose -p mexingsof_api -f "$c" pull "$SERVICE"; docker compose -p mexingsof_api -f "$c" run --rm --no-deps "$SERVICE" python manage.py migrate --noinput </dev/null; docker compose -p mexingsof_api -f "$c" up -d --no-deps "$SERVICE"; st=unknown; for n in $(seq 1 30); do st="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$SERVICE-pro")"; test "$st" = healthy && break; test "$st" = unhealthy && false; sleep 5; done; test "$st" = healthy; test "$(docker inspect -f '{{.Image}}' "$SERVICE-pro")" = "$(docker image inspect "$ref" -f '{{.Id}}')"; trap - ERR; rm -rf "$b" "$DOCKER_CONFIG"
          REMOTE
      - name: Evidence
        if: always()
        run: mkdir -p evidence; printf 'SERVICE=%s\nSOURCE_SHA=%s\nIMAGE_REF=%s\nRuntimeOwnership=SERVICE_ONLY\nEmailProviderPreserved=true\n' "$SERVICE" "${SOURCE_SHA:-unknown}" "${IMAGE_REF:-unknown}" > evidence/deployment.env
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-deploy-api-auth-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
